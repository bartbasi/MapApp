<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Step 0 map proof</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e8e6df; font-family: system-ui, sans-serif; }
      #map { position: absolute; inset: 0; }
      #panel {
        position: absolute; left: 8px; right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        max-width: 420px; padding: 8px 10px; border-radius: 8px;
        background: rgba(20, 24, 20, 0.86); color: #f2f2ea;
        font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap;
      }
      #run {
        position: absolute; right: 8px; top: calc(8px + env(safe-area-inset-top));
        padding: 10px 14px; border: 0; border-radius: 8px;
        background: #1f3d2a; color: #fff; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <button id="run">Run frame test</button>
    <div id="panel">starting</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
